# DevOps Journey Lab - nginx site config (included inside the `http {}` block
# of nginxinc/nginx-unprivileged, which listens as uid 101 on port 8080).
#
# The backend is reached through Docker's embedded DNS (127.0.0.11) and a
# variable upstream, so nginx starts (and `nginx -t` passes) even when the
# `backend` container is not up yet, and picks up a new backend IP after a
# restart. Edit `set $backend` below (and the resolver) to run outside compose.

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server_tokens off;

# Brute-force protection for login/register (per client IP).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# General API ceiling per client IP.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Honour X-Forwarded-Proto from a TLS-terminating proxy in front of this
# container; fall back to the scheme nginx itself saw.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    # The backend container hostname on the `edge` network.
    set $backend http://backend:8080;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/rss+xml image/svg+xml;

    # Security headers. `always` so they are also sent on 4xx/5xx responses.
    # NOTE: add_header inside a location replaces (does not extend) these, so
    # locations below deliberately avoid add_header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Liveness for the container healthcheck; never logged.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed JS/CSS/fonts under /assets/: cache for a year.
    # (Only expires is used here: any add_header in a location would drop the
    # server-level security headers, which nginx does not merge.)
    location ~* ^/assets/.+\.(?:js|css|woff2?)$ {
        try_files $uri =404;
        expires 1y;
    }

    # Other /assets/ files may come unhashed from public/assets: short cache.
    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    # Backend liveness/readiness (the UI footer polls /healthz same-origin).
    location ~ ^/(healthz|readyz)$ {
        limit_req zone=api burst=20 nodelay;
        access_log off;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Auth endpoints: strict rate limit.
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_conn perip 20;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (do not append) so clients cannot spoof their IP. If another
        # proxy terminates TLS in front of nginx, configure set_real_ip_from.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_conn perip 50;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (do not append) so clients cannot spoof their IP. If another
        # proxy terminates TLS in front of nginx, configure set_real_ip_from.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Terminal WebSocket.
    location /ws {
        limit_conn perip 10;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (do not append) so clients cannot spoof their IP. If another
        # proxy terminates TLS in front of nginx, configure set_real_ip_from.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA entry point: always revalidate so new deploys are picked up.
    location = /index.html {
        expires -1;
    }

    # Vue Router history mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles (e.g. a stray .env).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

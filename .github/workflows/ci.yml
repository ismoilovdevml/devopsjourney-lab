name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: backend-go/go.mod
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (vet, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-go
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devopslab_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U test -d devopslab_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend-go/go.sum

      - name: go mod verify
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
          working-directory: backend-go

      - name: go test -race
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: devopslab_test
          DB_SSLMODE: disable
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          JWT_SECRET: ci-only-not-a-secret-0123456789abcdef
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx --no-install vue-tsc --noEmit

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # hashFiles() is not available in a job-level `if`, so gate each step.
      - name: Check for e2e suite
        id: guard
        run: |
          if [ -f e2e/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::e2e/package.json not found; skipping end-to-end tests."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Generate .env with random secrets
        if: steps.guard.outputs.present == 'true'
        run: |
          scripts/gen-secrets.sh
          # Mask generated secrets in any later log output.
          grep -E '^(JWT_SECRET|DB_PASSWORD|REDIS_PASSWORD|ADMIN_PASSWORD)=' .env \
            | cut -d= -f2- | while read -r v; do echo "::add-mask::$v"; done
          # Test-only: Playwright logs in and creates labs many times from one IP.
          # LAB_ALLOW_NET_ADMIN=true keeps firewall-config runnable on the runc-only
          # runner (production default is false without LAB_RUNTIME, see SECURITY.md).
          # Drop the defaults copied from .env.example so each key appears exactly once.
          sed -i -E '/^(AUTH_RATE_LIMIT_PER_MIN|NGINX_AUTH_RATE|NGINX_AUTH_BURST|SESSION_RATE_LIMIT_PER_MIN|LAB_ALLOW_NET_ADMIN)=/d' .env
          cat >> .env <<'EOF'
          AUTH_RATE_LIMIT_PER_MIN=2000
          NGINX_AUTH_RATE=1200r/m
          NGINX_AUTH_BURST=500
          SESSION_RATE_LIMIT_PER_MIN=600
          LAB_ALLOW_NET_ADMIN=true
          EOF

      - name: Start stack
        if: steps.guard.outputs.present == 'true'
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Install Playwright
        if: steps.guard.outputs.present == 'true'
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        if: steps.guard.outputs.present == 'true'
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8088
        run: |
          set -a; . ../.env; set +a
          npx playwright test

      - name: Compose logs on failure
        if: failure() && steps.guard.outputs.present == 'true'
        run: docker compose logs --no-color --tail=300

      - name: Upload Playwright report
        if: always() && steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down
        if: always() && steps.guard.outputs.present == 'true'
        run: docker compose down -v --remove-orphans

  security:
    name: Security (secrets, vulns, config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend-go/go.sum

      - name: govulncheck
        working-directory: backend-go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (frontend)
        working-directory: frontend-vue
        run: npm audit --audit-level=high

      # Misconfiguration scan of Dockerfiles. The student lab image is a
      # deliberately root, offline sandbox (no network, runtime-limited by the
      # backend), so it is excluded from the non-root rule set.
      - name: trivy config
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.74.0 config \
            --quiet --exit-code 1 --severity HIGH,CRITICAL \
            --skip-files backend-go/lab-image/Dockerfile \
            /src

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend-go
          - name: frontend
            context: frontend-vue
          - name: lab
            context: backend-go/lab-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false
          tags: devopslab-${{ matrix.name }}:ci
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

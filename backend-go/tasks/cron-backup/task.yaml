id: cron-backup
title: "Test 6: Cron Job & Backup Automation"
image: ubuntu:22.04

setup:
  - apt-get update -qq
  - apt-get install -y cron tar -qq
  - service cron start
  - mkdir -p /var/www/html /backups

checks:
  - name: "Check if backup script exists"
    cmd: test -f /usr/local/bin/backup.sh
  - name: "Check if script is executable"
    cmd: test -x /usr/local/bin/backup.sh
  - name: "Check if crontab entry exists"
    cmd: crontab -l 2>/dev/null | grep -q "/usr/local/bin/backup.sh"
  - name: "Check if backup directory exists"
    cmd: test -d /backups
  - name: "Test if script creates backup successfully"
    cmd: /usr/local/bin/backup.sh && test -f /backups/website-backup-*.tar.gz

order: 6
difficulty: 3

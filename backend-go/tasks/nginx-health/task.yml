id: nginx-health
title: Nginx healthcheck
image: ubuntu:22.04

setup:
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y nginx curl

checks:
  - name: file exists
    cmd: test -f /var/www/html/index.html
  - name: content is ok
    cmd: 'grep -qx ok /var/www/html/index.html'
  - name: nginx running
    cmd: pgrep nginx >/dev/null
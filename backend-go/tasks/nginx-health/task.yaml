id: nginx-health
title: "Nginx Web Server Setup"
category: web
order: 1
difficulty: 1
points: 100
description: >-
  Publish a tiny health page with Nginx: create the page, start the web server
  and prove it answers on http://127.0.0.1/.
hints:
  - "Nginx is already installed. Its default document root is /var/www/html."
  - "The page must contain exactly one line: ok. Try: echo ok > /var/www/html/index.html"
  - "Validate the config with 'nginx -t', start it with 'service nginx start', then test with 'curl -s http://127.0.0.1/'."

# Runs offline inside the lab image (devopslab-lab); no network, no extra capabilities.
setup:
  - rm -f /var/www/html/index.html
  - nginx -s stop >/dev/null 2>&1 || true

checks:
  - name: "index.html exists in /var/www/html"
    cmd: test -f /var/www/html/index.html
  - name: "index.html contains exactly 'ok'"
    cmd: grep -qx ok /var/www/html/index.html
  - name: "Nginx configuration is valid"
    cmd: nginx -t
  - name: "Nginx is running"
    cmd: pgrep -x nginx >/dev/null
  - name: "http://127.0.0.1/ returns 200 with 'ok'"
    cmd: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)" = 200 && curl -s http://127.0.0.1/ | grep -qx ok
